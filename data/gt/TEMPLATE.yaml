# Ground truth for one property. Laser measurer (state model + accuracy class); every value measured twice:
# record both in *_raw and the mean in the main field. Photos of each measurement point go in data/gt/photos/.
property: home1
units: m
instrument: "Bosch GLM 50-27 C (+-1.5 mm)"
rooms:
  - id: living                 # free text, used to name rooms in reports
    # walls corner to corner at ~1 m height, counter-clockwise seen from above, start at any wall
    walls: [4.120, 3.050, 4.115, 3.055]
    walls_raw: [[4.121, 4.119], [3.050, 3.051], [4.115, 4.116], [3.055, 3.054]]
    walls_floor_level: [4.118, 3.049, 4.114, 3.053]
    ceiling_height: [2.712, 2.708, 2.711]          # centre + two corners
    floor_area: 12.57                               # product for rectangles; else from diagonals/triangles
    diagonals: [5.13]
    openings:
      # wall = index into walls above; offset = from that wall's start corner (CCW) to the near jamb
      - {id: door1, type: door, wall: 0, offset: 0.35, width: 0.810, height: 2.030}
      - {id: win1, type: window, wall: 2, offset: 1.10, width: 1.200, height: 1.100, sill: 0.900}
    damage:
      - {id: stain1, class: water_stain, surface: wall, wall: 1, u: 0.85, centroid_height: 0.25,
         width: 0.35, height: 0.22, area: 0.061}
adjacency:                                          # rooms joined by a doorway
  - [living, hall]
